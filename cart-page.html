<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="cart-page.css">

</head>
<body>


    <header>
        <div class="amazon-logo-div">
            <img src="images/icons/amazon-logo-white.png" alt="product-logo">
            <a href="product-page.html"></a>
        </div>

        <div class="cart-and-search-input">

            <div class="search-bar-and-input">
                    <input type="text" placeholder="Search" class="input-field">

                    <button class="search-bar-icon">
                        <img src="images/icons/search-icon.png" alt="search icon" class="search-icon">
                    </button>

                </div>

                <div class="cart-icon-number" onclick="location.href='cart-page.html'">
                    <img src="images/icons/cart-icon.png" alt="cart icon" class="cart-icon">
                    <p class="cart-number js-cart-number">0</p>
            </div>

        </div>


    </header>

    
</body>
</html>
